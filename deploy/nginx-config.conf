# Nginx Configuration for HOPE Project
# Save this as: /etc/nginx/sites-available/hope-project
# Then: sudo ln -s /etc/nginx/sites-available/hope-project /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    server_name _;  # Replace with your domain if you have one (e.g., api.yourdomain.com)

    # Increase max upload size (for file uploads)
    client_max_body_size 25M;

    # API Gateway Proxy
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Caching bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (for monitoring)
    location /health {
        proxy_pass http://localhost:3005/health;
        access_log off;
    }

    # Static uploads (if serving files from server)
    location /uploads {
        proxy_pass http://localhost:3005/uploads;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Logging
    access_log /var/log/nginx/hope-access.log;
    error_log /var/log/nginx/hope-error.log;
}

