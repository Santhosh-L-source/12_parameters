<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mentor Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
<nav class="navbar">
  <a href="{{ url_for('index') }}" class="nav-brand">CertVerify</a>
  <span class="nav-tag">Mentor Portal</span>
</nav>
<div class="page-wrap narrow">
  <div class="page-header">
    <h1>Mentor Login</h1>
    <p>Access the mentor review dashboard</p>
  </div>
  <div class="form-card">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-error">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('mentor_login') }}">
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter mentor password" autofocus required/>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" style="width:100%">Login</button>
      </div>
    </form>
    <p style="text-align:center;margin-top:1rem;font-size:.85rem;color:#666">
      Default password: <code>mentor@123</code>
    </p>
  </div>
</div>
</body>
</html>
